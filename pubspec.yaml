name: go_unicrew_task
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.11.4


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  http: ^1.6.0
  go_router: ^17.5.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#4F46E5"
  image: assets/images/splash_logo.png
  color_dark: "#1E1B4B"
  image_dark: assets/images/splash_logo.png

  android_12:
    image: assets/images/splash_logo_android12.png
    icon_background_color: "#4F46E5"
    image_dark: assets/images/splash_logo_android12.png
    icon_background_color_dark: "#1E1B4B"

  android: true
  ios: true
  web: false

